name: Angular Deploy (with retries)

on:
  push:
    branches: ["feature/upac"]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm i --force

      - name: Build Angular
        run: npm run build -- --configuration production

      - name: Deploy attempt #1
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: dist/front-sphere/browser/
          server-dir: /public_html/upacallstars/
          dangerous-clean-slate: false
          timeout: 120000

      - name: Wait before retry #2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 12

      - name: Deploy attempt #2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: dist/front-sphere/browser/
          server-dir: /public_html/dev/
          dangerous-clean-slate: false
          timeout: 120000

      - name: Wait before retry #3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Deploy attempt #3
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: dist/front-sphere/browser/
          server-dir: /public_html/dev/
          dangerous-clean-slate: false
          timeout: 120000

      - name: Fail if all attempts failed
        if: steps.deploy1.outcome == 'failure' && (steps.deploy2.outcome == 'failure' || steps.deploy2.outcome == '') && (steps.deploy3.outcome == 'failure' || steps.deploy3.outcome == '')
        run: |
          echo "All deploy attempts failed."
          exit 1
