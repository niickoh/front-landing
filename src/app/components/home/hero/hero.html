<!--
  Video hero. Mobile: the vertical video fills the screen. Desktop: the same <video> becomes a
  9:16 frame on the right (so it is never upscaled and cropped) over a blurred still of itself.
  [muted] as a property: Angular sets attributes after creating the element, which the browser ignores for autoplay.
-->
<section
  class="relative isolate flex min-h-svh flex-col overflow-hidden bg-ink lg:min-h-[min(100svh,60rem)]"
  aria-labelledby="hero-title"
>
  <div class="absolute inset-0 -z-10" aria-hidden="true">
    <img
      [src]="hero.imageSrc"
      alt=""
      class="absolute inset-0 h-full w-full object-cover lg:scale-110 lg:opacity-60 lg:blur-2xl"
    />
    @if (youtubeEmbedUrl) {
      <iframe
        [src]="youtubeEmbedUrl"
        title="Video de fondo"
        tabindex="-1"
        class="hero-video opacity-70"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    } @else if (hero.mediaType === 'video') {
      <video
        [muted]="true"
        [autoplay]="autoplay"
        [poster]="hero.imageSrc"
        [src]="hero.videoSrc"
        muted
        loop
        playsinline
        preload="metadata"
        disablepictureinpicture
        disableremoteplayback
        tabindex="-1"
        class="pointer-events-none absolute inset-0 h-full w-full object-cover lg:inset-auto lg:top-28 lg:right-[max(2.5rem,calc((100vw-80rem)/2+2.5rem))] lg:z-10 lg:aspect-[9/16] lg:h-[calc(100%-10.5rem)] lg:w-auto lg:rounded-3xl lg:shadow-[0_24px_60px_-12px_rgb(0_0_0/0.75)] lg:ring-1 lg:ring-white/15"
      ></video>
    }
    <div class="absolute inset-0 bg-gradient-to-t from-ink via-ink/25 via-45% to-ink/10"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-ink/70 via-ink/10 via-50% to-transparent"></div>
  </div>

  <div class="page-gutter flex flex-1 flex-col justify-end pt-24 pb-14 lg:pb-20">
    <div class="grid grid-cols-1 items-end gap-6 lg:pr-[22rem] xl:pr-[30rem]">
      <!-- 25th-anniversary seal: the crest's ring of stars, turned into a medal -->
      <div
        class="rise w-20 sm:w-28 lg:w-32"
        role="img"
        [attr.aria-label]="hero.eyebrow + ', ' + hero.proofLabel.toLowerCase()"
      >
        <svg viewBox="0 0 200 200" class="h-auto w-full" aria-hidden="true">
          <defs>
            <path id="seal-path" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0" />
          </defs>
          <circle cx="100" cy="100" r="97" fill="#120607" fill-opacity="0.72" />
          <circle cx="100" cy="100" r="96" fill="none" stroke="#e9b949" stroke-width="2" />
          <circle cx="100" cy="100" r="62" fill="#e3121b" />
          <g class="seal-ring">
            <text
              fill="#fbf7f6"
              font-family="Archivo, sans-serif"
              font-weight="700"
              font-size="15"
              letter-spacing="1.5"
            >
              <textPath href="#seal-path" textLength="486" lengthAdjust="spacing">
                {{ sealText }}
              </textPath>
            </text>
          </g>
          <text
            x="100"
            y="122"
            text-anchor="middle"
            fill="#fbf7f6"
            font-family="Archivo, sans-serif"
            font-stretch="75%"
            font-weight="900"
            font-size="70"
          >
            25
          </text>
        </svg>
      </div>

      <div class="max-w-2xl">
        <h1
          id="hero-title"
          class="display rise text-[clamp(2.75rem,11vw,6rem)] text-chalk [text-shadow:0_2px_24px_rgb(0_0_0/0.45)]"
          style="--rise-delay: 80ms"
        >
          <span class="block">{{ hero.title }}</span>
          <span class="block text-red">{{ hero.titleAccent }}</span>
        </h1>

        <p
          class="rise mt-4 max-w-sm text-base leading-relaxed text-chalk/90 sm:text-lg"
          style="--rise-delay: 200ms"
        >
          {{ hero.subtitle }}
        </p>

        <div
          class="rise mt-6 flex flex-col gap-3 sm:flex-row"
          style="--rise-delay: 300ms"
        >
          <a tuiButton size="m" appearance="primary" iconStart="@tui.play" routerLink="/videos">
            {{ hero.primaryCta }}
          </a>
          <a
            tuiButton
            size="m"
            appearance="secondary-grayscale"
            iconEnd="@tui.arrow-right"
            routerLink="/quienes-somos"
            class="backdrop-blur-sm"
          >
            {{ hero.secondaryCta }}
          </a>
        </div>
      </div>
    </div>
  </div>

</section>
