<!-- Full-bleed video hero -->
<section
  class="relative isolate flex min-h-svh flex-col overflow-hidden bg-ink lg:min-h-[min(100svh,60rem)]"
  aria-labelledby="hero-title"
>
  <div class="absolute inset-0 -z-10" aria-hidden="true">
    <img [src]="hero.imageSrc" alt="" class="absolute inset-0 h-full w-full object-cover" />
    @if (youtubeEmbedUrl) {
      <iframe
        [src]="youtubeEmbedUrl"
        title="Video de fondo"
        tabindex="-1"
        class="hero-video opacity-70"
        allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    } @else if (hero.mediaType === 'video') {
      <video
        [src]="hero.videoSrc"
        autoplay
        muted
        loop
        playsinline
        class="absolute inset-0 h-full w-full object-cover opacity-70"
      ></video>
    }
    <div class="absolute inset-0 bg-gradient-to-t from-ink via-ink/60 to-ink/30"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-ink/90 via-ink/40 to-transparent"></div>
  </div>

  <div class="page-gutter flex flex-1 flex-col justify-end pt-24 pb-20 lg:pb-32">
    <div class="grid grid-cols-1 items-end gap-8 lg:grid-cols-[minmax(0,1fr)_auto] lg:gap-16">
      <!-- 25th-anniversary seal: the crest's ring of stars, turned into a medal -->
      <div
        class="rise order-first w-28 sm:w-36 lg:order-none lg:col-start-2 lg:row-start-1 lg:w-60"
        role="img"
        [attr.aria-label]="hero.eyebrow + ', ' + hero.proofLabel.toLowerCase()"
      >
        <svg viewBox="0 0 200 200" class="h-auto w-full" aria-hidden="true">
          <defs>
            <path id="seal-path" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0" />
          </defs>
          <circle cx="100" cy="100" r="97" fill="#120607" fill-opacity="0.72" />
          <circle cx="100" cy="100" r="96" fill="none" stroke="#e9b949" stroke-width="2" />
          <circle cx="100" cy="100" r="62" fill="#e3121b" />
          <g class="seal-ring">
            <text
              fill="#fbf7f6"
              font-family="Archivo, sans-serif"
              font-weight="700"
              font-size="15"
              letter-spacing="1.5"
            >
              <textPath href="#seal-path" textLength="486" lengthAdjust="spacing">
                {{ sealText }}
              </textPath>
            </text>
          </g>
          <text
            x="100"
            y="122"
            text-anchor="middle"
            fill="#fbf7f6"
            font-family="Archivo, sans-serif"
            font-stretch="75%"
            font-weight="900"
            font-size="70"
          >
            25
          </text>
        </svg>
      </div>

      <div class="max-w-4xl">
        <h1
          id="hero-title"
          class="display rise text-[clamp(3.5rem,15vw,9.5rem)] text-chalk"
          style="--rise-delay: 80ms"
        >
          <span class="block">{{ hero.title }}</span>
          <span class="block text-red">{{ hero.titleAccent }}</span>
        </h1>

        <p
          class="rise mt-6 max-w-md text-lg leading-relaxed text-chalk/90 sm:text-xl"
          style="--rise-delay: 200ms"
        >
          {{ hero.subtitle }}
        </p>

        <div
          class="rise mt-8 flex flex-col gap-3 sm:flex-row"
          style="--rise-delay: 300ms"
        >
          <a tuiButton size="l" appearance="primary" iconStart="@tui.play" routerLink="/videos">
            {{ hero.primaryCta }}
          </a>
          <a
            tuiButton
            size="l"
            appearance="secondary-grayscale"
            iconEnd="@tui.arrow-right"
            routerLink="/quienes-somos"
            class="backdrop-blur-sm"
          >
            {{ hero.secondaryCta }}
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
