<section
  class="hero-stage relative flex min-h-[min(860px,100svh)] items-center overflow-hidden bg-[#0b0b0f]"
>
  @if (hero.youtubeUrl) {
    <iframe
      [src]="youtubeEmbedUrl"
      title="Hero video"
      class="pointer-events-none absolute inset-0 h-full w-full scale-[1.08] border-0 object-cover"
      allow="autoplay; encrypted-media; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  } @else if (hero.mediaType === 'image') {
    <img
      [src]="hero.imageSrc"
      alt="Hero principal"
      class="absolute inset-0 h-full w-full object-cover"
    />
  } @else {
    <video
      [src]="hero.videoSrc"
      autoplay
      muted
      loop
      playsinline
      class="absolute inset-0 h-full w-full object-cover opacity-70"
    ></video>
  }

  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_75%_25%,rgba(212,175,55,0.2),transparent_24%),linear-gradient(90deg,rgba(11,11,15,0.94)_0%,rgba(11,11,15,0.68)_44%,rgba(11,11,15,0.4)_100%)]"
  ></div>
  <div
    class="absolute inset-0 bg-[linear-gradient(0deg,rgba(11,11,15,0.92),transparent_32%,rgba(11,11,15,0.2))]"
  ></div>
  <div class="hero-red-line absolute bottom-0 left-0 h-1 w-2/3 bg-[#c1121f]"></div>

  <div
    class="relative z-10 mx-auto grid w-full max-w-7xl grid-cols-1 gap-12 px-5 pb-20 pt-32 sm:px-8 lg:grid-cols-[minmax(0,1fr)_280px] lg:items-end lg:gap-20 lg:px-12 lg:pb-28"
  >
    <div class="max-w-3xl text-left">
      <p class="hero-reveal text-sm font-bold tracking-[0.28em] text-[#d4af37] uppercase">
        {{ hero.eyebrow }}
      </p>

      <span
        class="hero-reveal mt-5 inline-flex items-center gap-2 border-l-2 border-[#c1121f] bg-black/20 px-3 py-2 text-xs font-semibold tracking-[0.2em] text-[#f6e7a9] uppercase"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-[#c1121f]"></span>
        {{ hero.badge }}
      </span>

      <h1
        class="hero-reveal mt-6 max-w-3xl text-5xl font-black leading-[0.98] tracking-tight text-white sm:text-6xl lg:text-8xl"
      >
        {{ hero.title }}
        <span class="block text-[#d4af37]">{{ hero.titleAccent }}</span>
      </h1>

      <p class="hero-reveal mt-7 max-w-xl text-base leading-8 text-[#f0f0f2] sm:text-lg">
        {{ hero.subtitle }}
      </p>

      <div class="hero-reveal mt-9 flex flex-col items-stretch gap-3 sm:flex-row sm:items-center">
        <p-button
          [label]="hero.primaryCta"
          icon="pi pi-play"
          size="large"
          [rounded]="false"
          routerLink="/videos"
          styleClass="hero-primary-button border-none bg-primary px-6 py-3 font-bold hover:bg-primary-dark"
        />
        <p-button
          [label]="hero.secondaryCta"
          icon="pi pi-arrow-down-right"
          severity="secondary"
          [outlined]="true"
          [rounded]="false"
          size="large"
          routerLink="/quienes-somos"
          styleClass="border-[#d4af37] px-6 py-3 font-bold text-[#f6e7a9] hover:bg-[#d4af37]/10"
        />
      </div>
    </div>

    <aside class="hero-reveal hidden border-l border-white/20 pl-7 lg:block">
      <div class="text-6xl font-black leading-none text-white">
        25<span class="text-[#c1121f]">+</span>
      </div>
      <p class="mt-3 text-xs font-bold tracking-[0.2em] text-[#d4af37] uppercase">
        {{ hero.proofLabel }}
      </p>
      <p class="mt-3 max-w-[180px] text-sm leading-6 text-[#d6d6dc]">{{ hero.proofText }}</p>
      <div class="mt-8 h-px w-12 bg-[#c1121f]"></div>
      <p class="mt-3 text-xs font-semibold tracking-[0.16em] text-white uppercase">
        Amor · Familia · Pasión
      </p>
    </aside>
  </div>

  <div
    class="absolute bottom-7 left-5 z-10 flex items-center gap-3 text-[#d6d6dc] sm:left-8 lg:left-12"
  >
    <span class="h-px w-8 bg-[#d4af37]"></span>
    <span class="text-[10px] font-bold tracking-[0.2em] uppercase">{{ hero.scrollLabel }}</span>
  </div>
  <div class="absolute bottom-7 right-5 z-10 text-[#d4af37] sm:right-8 lg:right-12">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </div>
</section>
