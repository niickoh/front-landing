<section class="relative flex min-h-screen items-center justify-center overflow-hidden">
  <img
    src="hero-bg.png"
    alt=""
    aria-hidden="true"
    class="absolute inset-0 h-full w-full object-cover"
  />
  <div class="absolute inset-0 bg-gradient-to-b from-dark/70 via-dark/50 to-dark"></div>

  <div class="relative z-10 mx-auto max-w-4xl px-4 pt-16 text-center sm:px-6 lg:px-8">
    <span
      class="inline-block rounded-full border border-primary/40 bg-primary/10 px-4 py-1.5 text-xs font-semibold tracking-wider text-primary-light uppercase"
    >
      Angular 20 · Tailwind · PrimeNG
    </span>

    <h1 class="mt-6 text-4xl font-extrabold tracking-tight text-white sm:text-5xl lg:text-6xl">
      Construimos tu presencia
      <span class="text-primary-light">digital</span> con impacto
    </h1>

    <p class="mx-auto mt-6 max-w-2xl text-lg text-gray-300">
      Landing pages modernas, rápidas y totalmente responsivas. Convertimos visitantes en clientes
      con diseño de clase mundial y tecnología de vanguardia.
    </p>

    <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
      <p-button
        label="Comenzar ahora"
        icon="pi pi-arrow-right"
        iconPos="right"
        size="large"
        [rounded]="true"
        routerLink="/contacto"
      />
      <p-button
        label="Conócenos"
        icon="pi pi-users"
        severity="secondary"
        [outlined]="true"
        [rounded]="true"
        size="large"
        routerLink="/quienes-somos"
      />
    </div>
  </div>

  <div class="absolute bottom-8 left-1/2 z-10 -translate-x-1/2 animate-bounce text-gray-400">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>
  </div>
</section>
