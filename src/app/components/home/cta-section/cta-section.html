<section class="bg-light py-20 sm:py-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div
      class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-primary-dark via-primary to-primary-light px-8 py-16 text-center shadow-2xl sm:px-16"
    >
      <div class="absolute inset-0 bg-dark/20"></div>
      <div class="relative">
        <h2 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">
          ¿Listo para comenzar tu proyecto?
        </h2>
        <p class="mx-auto mt-4 max-w-xl text-lg text-white/80">
          Déjanos tu correo y te contactaremos en menos de 24 horas para conversar sobre tu idea.
        </p>
        <p-button
          label="Quiero que me contacten"
          icon="pi pi-send"
          severity="contrast"
          [rounded]="true"
          size="large"
          (onClick)="openDialog()"
        />
      </div>
    </div>
  </div>

  <p-dialog
    header="Solicita tu contacto"
    [modal]="true"
    [(visible)]="dialogVisible"
    [style]="{ width: '92vw', maxWidth: '28rem' }"
  >
    <div class="flex flex-col gap-4 pt-2">
      <p class="text-sm text-gray-600">
        Ingresa tu correo electrónico y nuestro equipo se pondrá en contacto contigo.
      </p>

      <div class="flex flex-col gap-1.5">
        <label for="cta-email" class="text-sm font-medium text-dark">Correo electrónico</label>
        <input
          pInputText
          id="cta-email"
          type="email"
          placeholder="tucorreo@ejemplo.com"
          class="w-full"
          [value]="email()"
          [attr.aria-invalid]="!!emailError()"
          (input)="onEmailInput($event)"
          (keyup.enter)="subscribe()"
        />
        @if (emailError()) {
          <small class="text-xs font-medium text-primary">{{ emailError() }}</small>
        }
      </div>

      <div class="mt-2 flex justify-end gap-2">
        <p-button
          label="Cancelar"
          severity="secondary"
          [text]="true"
          (onClick)="dialogVisible.set(false)"
        />
        <p-button label="Enviar" icon="pi pi-check" (onClick)="subscribe()" />
      </div>
    </div>
  </p-dialog>
</section>
