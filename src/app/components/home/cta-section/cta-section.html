<section class="relative isolate overflow-hidden bg-red py-20 lg:py-28" aria-labelledby="cta-title">
  <!-- Oversized crest star, cropped, as a watermark -->
  <svg
    class="absolute -right-24 -bottom-24 -z-10 h-[24rem] w-[24rem] text-red-deep lg:h-[38rem] lg:w-[38rem]"
    viewBox="0 0 24 24"
    fill="currentColor"
    aria-hidden="true"
  >
    <path d="M12 1.5l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 17.6l-6.4 3.5 1.4-7.1-5.3-5 7.2-.9L12 1.5Z" />
  </svg>

  <div class="page-gutter">
    <div class="max-w-3xl">
      <h2 id="cta-title" class="display text-5xl text-chalk sm:text-6xl lg:text-7xl">
        {{ cta.title }}
      </h2>
      <p class="mt-6 max-w-2xl text-lg leading-relaxed text-chalk/90">
        {{ cta.description }}
      </p>
      <div class="mt-10 flex flex-col sm:flex-row">
        <button
          tuiButton
          type="button"
          size="l"
          iconEnd="@tui.arrow-right"
          class="bg-chalk! text-ink! hover:bg-ink! hover:text-chalk!"
          (click)="openDialog()"
        >
          {{ cta.button }}
        </button>
      </div>
    </div>
  </div>
</section>

<ng-template
  [(tuiDialog)]="dialogVisible"
  [tuiDialogOptions]="{ label: cta.dialogTitle, size: 's' }"
>
  <form class="flex flex-col gap-5" (ngSubmit)="subscribe()" novalidate>
    <p class="text-muted">{{ cta.dialogDescription }}</p>

    <div class="flex flex-col gap-1">
      <tui-textfield iconStart="@tui.mail">
        <label tuiLabel for="cta-email">{{ cta.emailLabel }}</label>
        <input
          tuiInput
          id="cta-email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          [placeholder]="cta.emailPlaceholder"
          [invalid]="!!emailError()"
          [ngModel]="email()"
          (ngModelChange)="onEmailInput($event)"
          [attr.aria-describedby]="emailError() ? 'cta-email-error' : null"
        />
      </tui-textfield>
      <tui-error id="cta-email-error" [error]="emailError()" />
    </div>

    <div class="mt-2 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        tuiButton
        type="button"
        size="m"
        appearance="flat-grayscale"
        (click)="dialogVisible.set(false)"
      >
        {{ cta.cancel }}
      </button>
      <button tuiButton type="submit" size="m" appearance="primary" iconEnd="@tui.send">
        {{ cta.send }}
      </button>
    </div>
  </form>
</ng-template>
