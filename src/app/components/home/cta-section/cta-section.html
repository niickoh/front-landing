<section class="bg-[#0b0b0f] py-20 sm:py-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div
      class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-[#0b0b0f] via-[#1d1d22] to-[#c1121f] px-8 py-16 text-center shadow-2xl sm:px-16"
    >
      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(212,175,55,0.15),transparent_35%)]"
      ></div>
      <div class="relative">
        <span class="text-sm font-semibold tracking-[0.2em] text-[#d4af37] uppercase">
          {{ cta.eyebrow }}
        </span>
        <h2 class="mt-3 text-3xl font-bold tracking-tight text-white sm:text-4xl">
          {{ cta.title }}
        </h2>
        <p class="mx-auto mt-4 max-w-3xl text-lg leading-relaxed text-[#f3f4f6]">
          {{ cta.description }}
        </p>
        <div class="mt-8">
          <p-button
            [label]="cta.button"
            icon="pi pi-send"
            severity="contrast"
            [rounded]="true"
            size="large"
            (onClick)="openDialog()"
            styleClass="bg-primary hover:bg-primary-dark border-none"
          />
        </div>
      </div>
    </div>
  </div>

  <p-dialog
    [header]="cta.dialogTitle"
    [modal]="true"
    [(visible)]="dialogVisible"
    [style]="{ width: '92vw', maxWidth: '28rem' }"
  >
    <div class="flex flex-col gap-4 pt-2">
      <p class="text-sm text-gray-600">
        {{ cta.dialogDescription }}
      </p>

      <div class="flex flex-col gap-1.5">
        <label for="cta-email" class="text-sm font-medium text-dark">{{ cta.emailLabel }}</label>
        <input
          pInputText
          id="cta-email"
          type="email"
          [placeholder]="cta.emailPlaceholder"
          class="w-full"
          [value]="email()"
          [attr.aria-invalid]="!!emailError()"
          (input)="onEmailInput($event)"
          (keyup.enter)="subscribe()"
        />
        @if (emailError()) {
          <small class="text-xs font-medium text-primary">{{ emailError() }}</small>
        }
      </div>

      <div class="mt-2 flex justify-end gap-2">
        <p-button
          [label]="cta.cancel"
          severity="secondary"
          [text]="true"
          (onClick)="dialogVisible.set(false)"
        />
        <p-button [label]="cta.send" icon="pi pi-check" (onClick)="subscribe()" />
      </div>
    </div>
  </p-dialog>
</section>
