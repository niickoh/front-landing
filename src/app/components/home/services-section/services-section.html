<section class="bg-[#111111] py-20 sm:py-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-3xl text-center">
      <span class="text-sm font-semibold tracking-[0.2em] text-[#d4af37] uppercase"
        >Nuestro enfoque</span
      >
      <h2 class="mt-2 text-3xl font-bold tracking-tight text-white sm:text-4xl">
        Un equipo comprometido con la excelencia del cheerleading
      </h2>
    </div>

    <div class="mt-16 grid grid-cols-1 gap-8 md:grid-cols-3">
      @for (service of services; track service.title) {
        <article
          class="flex flex-col rounded-2xl border border-[#2c2c36] bg-[#141419] p-8 transition-all hover:-translate-y-1 hover:border-[#d4af37]/60"
        >
          <div class="text-4xl">{{ service.icon }}</div>
          <h3 class="mt-5 text-xl font-semibold text-white">{{ service.title }}</h3>
          <p class="mt-3 flex-1 leading-relaxed text-[#d6d6dc]">{{ service.description }}</p>
          <div class="mt-6 flex flex-wrap gap-2">
            @for (tag of service.tags; track tag) {
              <span
                class="rounded-full border border-[#d4af37]/40 bg-[#d4af37]/10 px-3 py-1 text-xs font-medium text-[#f6e7a9]"
              >
                {{ tag }}
              </span>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
