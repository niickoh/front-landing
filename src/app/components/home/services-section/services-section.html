<section class="bg-dark py-20 sm:py-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <span class="text-sm font-semibold tracking-wider text-primary-light uppercase">Servicios</span>
      <h2 class="mt-2 text-3xl font-bold tracking-tight text-white sm:text-4xl">
        Soluciones que impulsan tu negocio
      </h2>
      <p class="mt-4 text-lg text-gray-400">
        Desde la idea hasta el despliegue, te acompañamos en cada etapa.
      </p>
    </div>

    <div class="mt-16 grid grid-cols-1 gap-8 md:grid-cols-3">
      @for (service of services; track service.title) {
        <article
          class="flex flex-col rounded-2xl border border-white/10 bg-surface p-8 transition-all hover:-translate-y-1 hover:border-primary/40"
        >
          <div class="text-3xl">{{ service.icon }}</div>
          <h3 class="mt-5 text-xl font-semibold text-white">{{ service.title }}</h3>
          <p class="mt-3 flex-1 leading-relaxed text-gray-400">{{ service.description }}</p>
          <div class="mt-6 flex flex-wrap gap-2">
            @for (tag of service.tags; track tag) {
              <span
                class="rounded-full border border-secondary/40 bg-secondary/10 px-3 py-1 text-xs font-medium text-blue-300"
              >
                {{ tag }}
              </span>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
