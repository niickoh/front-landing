<section class="bg-wine py-20 lg:py-28" aria-labelledby="approach-title">
  <div class="page-gutter grid grid-cols-1 gap-12 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] lg:gap-20">
    <div class="lg:sticky lg:top-28 lg:self-start">
      <h2 id="approach-title" class="display text-5xl sm:text-6xl">
        Un equipo comprometido con la excelencia del cheerleading
      </h2>
    </div>

    <ul class="border-t border-line">
      @for (service of services; track service.title) {
        <li class="border-b border-line py-8 lg:py-10">
          <h3 class="display text-3xl text-chalk sm:text-4xl">{{ service.title }}</h3>
          <p class="mt-3 max-w-prose text-lg leading-relaxed text-muted">
            {{ service.description }}
          </p>
          <ul class="mt-5 flex flex-wrap gap-2" aria-label="Énfasis">
            @for (tag of service.tags; track tag) {
              <li class="border border-line px-3 py-1 text-sm font-medium text-chalk/85">
                {{ tag }}
              </li>
            }
          </ul>
        </li>
      }
    </ul>
  </div>
</section>
