<section class="bg-light py-20 sm:py-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <span class="text-sm font-semibold tracking-wider text-primary uppercase">Características</span>
      <h2 class="mt-2 text-3xl font-bold tracking-tight text-dark sm:text-4xl">
        Todo lo que necesitas para destacar
      </h2>
      <p class="mt-4 text-lg text-gray-600">
        Cada detalle está pensado para ofrecer la mejor experiencia a tus usuarios.
      </p>
    </div>

    <div class="mt-16 grid grid-cols-1 gap-8 md:grid-cols-3">
      @for (feature of features; track feature.title) {
        <article
          class="group rounded-2xl border border-gray-200 bg-white p-8 shadow-sm transition-all hover:-translate-y-1 hover:border-primary/30 hover:shadow-lg"
        >
          <div
            class="flex h-12 w-12 items-center justify-center rounded-xl bg-primary/10 text-2xl transition-colors group-hover:bg-primary/20"
          >
            {{ feature.icon }}
          </div>
          <h3 class="mt-6 text-xl font-semibold text-dark">{{ feature.title }}</h3>
          <p class="mt-3 leading-relaxed text-gray-600">{{ feature.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
