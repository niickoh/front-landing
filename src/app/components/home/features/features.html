<section class="bg-[#0b0b0f] py-20 sm:py-28">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <span class="text-sm font-semibold tracking-[0.2em] text-[#d4af37] uppercase">
        {{ teamsSection.title }}
      </span>
      <h2 class="mt-2 text-3xl font-bold tracking-tight text-white sm:text-4xl">
        Formación, identidad y energía Panthers
      </h2>
    </div>

    <div class="mt-16 grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3">
      @for (team of teamsSection.teams; track team.id) {
        <article
          class="group rounded-2xl border border-[#2c2c36] bg-[#141419] p-5 shadow-lg shadow-black/20 transition-all hover:-translate-y-1 hover:border-[#d4af37]/60"
        >
          <div class="flex items-center justify-center overflow-hidden rounded-xl bg-[#0b0b0f] p-4">
            <img
              [src]="team.logo || 'https://placehold.co/220x220/0b0b0f/d4af37?text=UPAC'"
              [alt]="team.displayName"
              class="h-24 w-24 object-contain"
            />
          </div>
          <h3 class="mt-5 text-center text-xl font-semibold text-white">{{ team.displayName }}</h3>
        </article>
      }
    </div>
  </div>
</section>
