<header class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-ink/85 backdrop-blur-md">
  <nav class="page-gutter flex h-16 items-center justify-between gap-4" aria-label="Principal">
    <a
      [routerLink]="header.logo.href"
      class="flex min-h-11 items-center gap-3"
      (click)="closeMenu()"
    >
      <img [src]="header.logo.src" [alt]="header.logo.alt" class="h-10 w-10 object-contain" />
      <span class="display text-2xl not-italic tracking-wide">{{ brand.full }}</span>
    </a>

    <ul class="hidden items-center gap-1 md:flex">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="text-chalk! after:scale-x-100!"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            #rla="routerLinkActive"
            [attr.aria-current]="rla.isActive ? 'page' : null"
            class="relative inline-flex min-h-11 items-center px-3 font-medium text-muted transition-colors after:absolute after:inset-x-3 after:bottom-2 after:h-0.5 after:origin-left after:scale-x-0 after:bg-red after:transition-transform hover:text-chalk"
          >
            {{ item.label }}
          </a>
        </li>
      }
      <li class="ml-4">
        <a routerLink="/contacto" class="btn btn-primary min-h-10! px-5! text-base!">
          Contáctanos
        </a>
      </li>
    </ul>

    <button
      type="button"
      class="-mr-2 inline-flex h-11 w-11 items-center justify-center text-chalk md:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleMenu()"
    >
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        @if (menuOpen()) {
          <path stroke-linecap="round" d="M6 18 18 6M6 6l12 12" />
        } @else {
          <path stroke-linecap="round" d="M4 7h16M4 12h16M4 17h10" />
        }
      </svg>
    </button>
  </nav>
</header>

<!-- Mobile sheet (pattern adapted from 21st.dev "Classic Header with Sheet Menu") -->
<div
  class="fixed inset-0 z-40 bg-black/60 transition-opacity duration-200 md:hidden"
  [class.opacity-0]="!menuOpen()"
  [class.pointer-events-none]="!menuOpen()"
  aria-hidden="true"
  (click)="closeMenu()"
></div>
<div
  id="mobile-menu"
  class="fixed inset-y-0 right-0 z-40 flex w-[min(20rem,85vw)] flex-col bg-wine pt-20 pb-[max(1.5rem,env(safe-area-inset-bottom))] shadow-2xl transition-[transform,visibility] duration-300 ease-out md:hidden"
  [class.translate-x-full]="!menuOpen()"
  [class.invisible]="!menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
>
  <ul class="flex flex-col px-4">
    @for (item of navItems; track item.path) {
      <li class="border-b border-line">
        <a
          [routerLink]="item.path"
          routerLinkActive="text-chalk!"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          #rlaMobile="routerLinkActive"
          [attr.aria-current]="rlaMobile.isActive ? 'page' : null"
          class="display flex min-h-14 items-center text-3xl text-muted"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
  <div class="mt-auto px-6">
    <a routerLink="/contacto" class="btn btn-primary w-full" (click)="closeMenu()">Contáctanos</a>
  </div>
</div>
