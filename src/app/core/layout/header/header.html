<header class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-ink/80 backdrop-blur-md">
  <nav class="page-gutter flex h-16 items-center justify-between gap-4" aria-label="Principal">
    <a
      [routerLink]="header.logo.href"
      class="flex min-h-11 items-center gap-3"
      (click)="closeMenu()"
    >
      <img [src]="header.logo.src" [alt]="header.logo.alt" class="h-10 w-10 object-contain" />
      <span class="display text-2xl tracking-wide">{{ brand.full }}</span>
    </a>

    <ul class="hidden items-center gap-1 md:flex">
      @for (item of navItems; track item.path) {
        <li>
          <a
            tuiButton
            size="s"
            appearance="flat-grayscale"
            [routerLink]="item.path"
            routerLinkActive="text-chalk! bg-white/10!"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            #rla="routerLinkActive"
            [attr.aria-current]="rla.isActive ? 'page' : null"
            class="text-muted! normal-case! font-sans! font-semibold! tracking-normal!"
          >
            {{ item.label }}
          </a>
        </li>
      }
      <li class="ml-3">
        <a tuiButton size="m" appearance="primary" routerLink="/contacto">Contáctanos</a>
      </li>
    </ul>

    <button
      tuiIconButton
      type="button"
      size="m"
      appearance="flat-grayscale"
      class="-mr-2 md:hidden!"
      [iconStart]="menuOpen() ? '@tui.x' : '@tui.menu'"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      (click)="toggleMenu()"
    >
      {{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}
    </button>
  </nav>
</header>

<!-- Mobile menu: Taiga UI drawer from the right, with backdrop -->
<ng-template [tuiPopup]="menuOpen()">
  <tui-drawer
    id="mobile-menu"
    direction="end"
    [overlay]="true"
    class="w-[min(22rem,88vw)]! md:hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Menú"
    (click)="onDrawerClick($event)"
  >
    <div class="-mt-2 mb-2 flex items-center justify-between">
      <span class="eyebrow">Menú</span>
      <button
        tuiIconButton
        type="button"
        size="m"
        appearance="flat-grayscale"
        iconStart="@tui.x"
        (click)="closeMenu()"
      >
        Cerrar menú
      </button>
    </div>

    <ul class="-mx-2 flex flex-col gap-1">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-white/10 text-chalk! [&_.nav-dot]:opacity-100"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
            #rlaMobile="routerLinkActive"
            [attr.aria-current]="rlaMobile.isActive ? 'page' : null"
            class="flex min-h-14 items-center justify-between rounded-2xl px-4 text-muted transition-colors hover:bg-white/5 hover:text-chalk"
            (click)="closeMenu()"
          >
            <span class="display text-3xl">{{ item.label }}</span>
            <span class="nav-dot h-2 w-2 rounded-full bg-red opacity-0" aria-hidden="true"></span>
          </a>
        </li>
      }
    </ul>

    <footer class="px-5 pt-4 pb-[max(1.5rem,env(safe-area-inset-bottom))]">
      <a
        tuiButton
        size="l"
        appearance="primary"
        routerLink="/contacto"
        class="w-full"
        (click)="closeMenu()"
      >
        Contáctanos
      </a>
    </footer>
  </tui-drawer>
</ng-template>
